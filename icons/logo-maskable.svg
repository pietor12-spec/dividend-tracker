<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243b"/><stop offset=".55" stop-color="#0b1424"/><stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".28" r=".6">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".35" cy=".78" r=".55">
      <stop offset="0" stop-color="#ffd740" stop-opacity=".18"/><stop offset="1" stop-color="#ffd740" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/><stop offset=".35" stop-color="#ffd95a"/><stop offset=".75" stop-color="#e9a90c"/><stop offset="1" stop-color="#b97d00"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5c00"/><stop offset=".25" stop-color="#d9a21a"/><stop offset=".5" stop-color="#ffd75a"/><stop offset=".75" stop-color="#c88d0a"/><stop offset="1" stop-color="#7a5000"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#d49a06"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00a6bd"/><stop offset="1" stop-color="#8ff6ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="ag" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
  </defs>
  <g>
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" fill="url(#glow2)"/>
    <!-- rejilla sutil -->
    <g stroke="#ffffff" stroke-opacity=".035" stroke-width="2">
      <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
    </g>
  </g>
  <g transform="translate(256 256) scale(.8) translate(-256 -256)">

  <!-- barras -->
  <defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ee8ff" stop-opacity=".85"/><stop offset="1" stop-color="#00a6bd" stop-opacity=".15"/></linearGradient></defs>
  <g fill="url(#bar)"><rect x="352" y="330" width="30" height="108" rx="7"/><rect x="394" y="276" width="30" height="162" rx="7"/><rect x="436" y="214" width="30" height="224" rx="7"/></g>
  <!-- pila de monedas -->
  <g filter="url(#sh)">
    <!-- moneda 3 (abajo) -->
    <path d="M96 372v26c0 22 54 40 120 40s120-18 120-40v-26z" fill="url(#edge)"/>
    <ellipse cx="216" cy="372" rx="120" ry="40" fill="url(#face)"/>
    <g stroke="#7a5000" stroke-opacity=".45" stroke-width="3"><path d="M116 386v24M146 394v26M176 399v27M206 401v28M236 401v28M266 399v27M296 394v26M326 386v24"/></g>
    <!-- moneda 2 -->
    <path d="M96 318v26c0 22 54 40 120 40s120-18 120-40v-26z" fill="url(#edge)"/>
    <ellipse cx="216" cy="318" rx="120" ry="40" fill="url(#face)"/>
    <g stroke="#7a5000" stroke-opacity=".45" stroke-width="3"><path d="M116 332v24M146 340v26M176 345v27M206 347v28M236 347v28M266 345v27M296 340v26M326 332v24"/></g>
    <!-- moneda 1 (arriba) -->
    <path d="M96 264v26c0 22 54 40 120 40s120-18 120-40v-26z" fill="url(#edge)"/>
    <g stroke="#7a5000" stroke-opacity=".45" stroke-width="3"><path d="M116 278v24M146 286v26M176 291v27M206 293v28M236 293v28M266 291v27M296 286v26M326 278v24"/></g>
    <ellipse cx="216" cy="264" rx="120" ry="40" fill="url(#face)"/>
    <ellipse cx="216" cy="264" rx="96" ry="30" fill="url(#inner)" stroke="#a87300" stroke-opacity=".55" stroke-width="3"/>
    <!-- € grabado -->
    <g transform="translate(216 264) scale(1 .34)" fill="none" stroke="#7a4f00" stroke-width="16" stroke-linecap="round">
      <path d="M38 -46 A60 60 0 1 0 38 46"/>
      <path d="M-62 -14 H22 M-62 16 H16"/>
    </g>
  </g>

  <!-- flecha de crecimiento -->
  <g filter="url(#ag)">
    <path d="M70 226 L176 150 L240 190 L376 92" fill="none" stroke="url(#arrow)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330 78 L418 64 L404 152 Z" fill="#8ff6ff" stroke="#8ff6ff" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <!-- chispa -->
  
</g></svg>
